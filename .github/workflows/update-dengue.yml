name: Update dengue clusters

on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours (GitHub may delay scheduled runs slightly)
  workflow_dispatch:            # also allows a manual "Run workflow" button

permissions:
  contents: write               # needed so the action can commit dengue.geojson

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download latest dengue GeoJSON from data.gov.sg
        run: |
          set -euo pipefail
          POLL="https://api-open.data.gov.sg/v1/public/api/datasets/d_dbfabf16158d1b0e1c420627c0819168/poll-download"
          URL=$(curl -fsS "$POLL" | jq -r '.data.url // empty')
          if [ -z "$URL" ]; then
            echo "poll-download returned no file link" >&2
            exit 1
          fi
          curl -fsS "$URL" -o dengue.geojson.tmp
          # Refuse to overwrite the good file with an empty or invalid one
          jq -e '.features | length > 0' dengue.geojson.tmp > /dev/null
          mv dengue.geojson.tmp dengue.geojson

      - name: Commit if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dengue.geojson
          if git diff --cached --quiet; then
            echo "No change in dengue data."
          else
            git commit -m "Update dengue clusters ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
